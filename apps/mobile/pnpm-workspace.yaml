# Standalone pnpm root. Having this file here means `pnpm install` run inside
# apps/mobile resolves THIS as the workspace root — it does NOT join the
# islam.se monorepo (which is also why apps/mobile is excluded in the root
# pnpm-workspace.yaml). Keeps the Expo toolchain fully isolated from the
# content-pipeline packages.
packages: []

# Dependencies explicitly allowed (or denied) to run install/build scripts (pnpm 11).
allowBuilds:
  # Skia 3 reads prebuilt Graphite/Dawn libraries from sibling packages.
  # Keep lifecycle scripts explicitly allowed for native package updates.
  react-native-skia: true
  # Optional native msgpack accelerator; the pure-JS fallback is fine for us.
  msgpackr-extract: false
  # Jest 30's file watcher (via jest-haste-map, pulled in by jest-expo 58). Its install
  # script only runs node-gyp when npm_config_build_from_source=true; otherwise it does
  # nothing and the prebuilt @parcel/watcher-<platform> optional dependency is used.
  # Denied: there is nothing for it to build.
  '@parcel/watcher': false
  # Rust-based module resolver used by lint tooling; native binary is preferred.
  unrs-resolver: true
  # The sentry-cli binary that uploads source maps and debug symbols during the EAS
  # build (pulled in by @sentry/react-native). Normally the postinstall only confirms
  # that the platform package from optionalDependencies (@sentry/cli-linux-x64,
  # -darwin, …) resolved; if it did not, it falls back to a checksum-validated download
  # from Sentry's CDN. Denying it would turn that fallback into a build that silently
  # ships without symbolicated crashes.
  '@sentry/cli': true

  # --- @swmansion/argent's native deps (added 2026-08-10 with `argent init --local`).
  # init writes these as the literal string "set this to true or false", which makes
  # `pnpm install` fail with ERR_PNPM_IGNORED_BUILDS until each one is decided — so they
  # are decided here rather than left for the next person to hit.
  #
  # tree-sitter and its two grammars are REQUIRED dependencies of argent (its code
  # analysis parses JS/TS), so they build.
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  # Optional dependency of argent — the PTY it shells commands through. Allowed so the
  # local copy has the same capabilities as a global install.
  node-pty: true
  # WebTransport-over-HTTP/3, which builds Cloudflare's quiche from source (Rust + C++)
  # — minutes of compile on every fresh install, on every machine. Denied: it is the
  # HTTP/3 transport for a WebTransport stack that simulator/emulator control never
  # takes, and the package resolves to its JS path without the native addon. Same
  # trade as msgpackr-extract above. If an argent feature ever reports a missing
  # webtransport binding, this is the line to flip.
  '@fails-components/webtransport-transport-http3-quiche': false

# Each entry deliberately bypasses pnpm's 24 h supply-chain delay for ONE exact version,
# and only ever as a stopgap: the delay is doing real work for every other package, so a
# line here is a debt to pay off, not a setting. An entry stops doing anything once its
# version is a day old — the argent@0.20.0 entry that lived here was removed on
# 2026-08-19 when the project moved to 0.21.0, which was already two days published and
# needed no exemption at all.
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.10'
  - '@expo/metro-config@58.0.14'
  - '@expo/package-manager@1.14.2'
  - '@expo/prebuild-config@58.0.14'
  - '@expo/router-server@58.0.14'
  - babel-preset-expo@58.0.17
  - expo-asset@58.0.16
  - expo-modules-core@58.0.21
  - expo-modules-jsi@58.0.14
  - expo@58.0.13
  - '@expo/ui@58.0.20'
  - expo-application@58.1.2
  - expo-background-task@58.0.11
  - expo-blur@58.0.4
  - expo-glass-effect@58.0.4
  - expo-haptics@58.0.7
  - expo-location@58.0.17
  - expo-notifications@58.1.5
  - expo-router@58.0.22
  - expo-splash-screen@58.0.10
  - expo-system-ui@58.0.6
  - expo-task-manager@58.0.12
  - expo-updates@58.0.17
  - expo-widgets@58.0.20
  - jest-expo@58.0.11
  - '@expo/schema-utils@58.0.2'
  - expo-build-properties@58.0.11
  - react-native-skia@3.6.2

# React Native / Expo autolinking and Metro do not cope with pnpm's default
# symlinked, isolated node_modules. Hoisted layout is the supported setup.
nodeLinker: hoisted

patchedDependencies:
  expo-widgets@58.0.20: patches/expo-widgets@58.0.20.patch
