# Standalone pnpm root. Having this file here means `pnpm install` run inside
# apps/mobile resolves THIS as the workspace root — it does NOT join the
# islam.se monorepo (which is also why apps/mobile is excluded in the root
# pnpm-workspace.yaml). Keeps the Expo toolchain fully isolated from the
# content-pipeline packages.
packages: []

# Dependencies explicitly allowed (or denied) to run install/build scripts (pnpm 11).
allowBuilds:
  # Kept `true`, but as of Skia 2.10.1 there is nothing left for it to run: the
  # postinstall (install-libs.js) that used to stage the prebuilt native libraries
  # into node_modules/@shopify/react-native-skia/libs was removed in 2.6.5. Gradle
  # and the podspec now read them straight out of the sibling packages
  # (react-native-skia-android/libs, react-native-skia-apple-ios/libs). Left as
  # `true` rather than `false` so a future version that reintroduces a lifecycle
  # script is not silently skipped — pnpm errors on an undecided package, so this
  # key has to hold some value either way.
  '@shopify/react-native-skia': true
  # Optional native msgpack accelerator; the pure-JS fallback is fine for us.
  msgpackr-extract: false
  # Rust-based module resolver used by lint tooling; native binary is preferred.
  unrs-resolver: true

  # --- @swmansion/argent's native deps (added 2026-08-10 with `argent init --local`).
  # init writes these as the literal string "set this to true or false", which makes
  # `pnpm install` fail with ERR_PNPM_IGNORED_BUILDS until each one is decided — so they
  # are decided here rather than left for the next person to hit.
  #
  # tree-sitter and its two grammars are REQUIRED dependencies of argent (its code
  # analysis parses JS/TS), so they build.
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  # Optional dependency of argent — the PTY it shells commands through. Allowed so the
  # local copy has the same capabilities as a global install.
  node-pty: true
  # WebTransport-over-HTTP/3, which builds Cloudflare's quiche from source (Rust + C++)
  # — minutes of compile on every fresh install, on every machine. Denied: it is the
  # HTTP/3 transport for a WebTransport stack that simulator/emulator control never
  # takes, and the package resolves to its JS path without the native addon. Same
  # trade as msgpackr-extract above. If an argent feature ever reports a missing
  # webtransport binding, this is the line to flip.
  '@fails-components/webtransport-transport-http3-quiche': false

# Each entry deliberately bypasses pnpm's 24 h supply-chain delay for ONE exact version,
# and only ever as a stopgap: the delay is doing real work for every other package, so a
# line here is a debt to pay off, not a setting. An entry stops doing anything once its
# version is a day old — the argent@0.20.0 entry that lived here was removed on
# 2026-08-19 when the project moved to 0.21.0, which was already two days published and
# needed no exemption at all.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.18'
  - '@expo/fingerprint@0.20.10'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.7'
  - '@expo/metro-config@57.0.10'
  - '@expo/prebuild-config@57.0.14'
  - expo-asset@57.0.14
  - expo-constants@57.0.14
  - expo-server@57.0.2
  - expo@57.0.16
  - '@expo/metro-runtime@57.0.13'
  - '@expo/ui@57.0.13'
  - expo-dev-client@57.0.15
  - expo-dev-launcher@57.0.15
  - expo-dev-menu@57.0.15
  - expo-location@57.0.13
  - expo-notifications@57.0.14
  - expo-router@57.0.16
  - expo-splash-screen@57.0.8
  - expo-updates@57.0.17
  - expo-widgets@57.0.12
  - jest-expo@57.0.4
  - '@expo/router-server@57.0.7'
  - expo-file-system@57.0.5
  - expo-modules-core@57.0.13
  - expo-modules-jsi@57.0.5
  - expo-linking@57.0.7
  - expo-audio@57.0.4
  - expo-background-task@57.0.13
  - expo-task-manager@57.0.13
  - '@expo/config-plugins@57.0.9'
  - '@expo/config@57.0.9'
  - '@expo/image-utils@0.11.5'
  - '@expo/metro-file-map@57.0.2'
  - '@expo/require-utils@57.0.5'
  - babel-preset-expo@57.0.8
  - expo-modules-autolinking@57.0.11

# React Native / Expo autolinking and Metro do not cope with pnpm's default
# symlinked, isolated node_modules. Hoisted layout is the supported setup.
nodeLinker: hoisted

# `expo` declares `@expo/dom-webview` as an OPTIONAL peer; `@expo/log-box` (pulled in
# by @expo/cli) declares the same peer as required. pnpm's autoInstallPeers therefore
# installed it — and then never re-resolved it when log-box widened the range to ^57,
# leaving 56.0.5 behind and failing expo-doctor's overridden-dependency check.
#
# That mismatch is more than a doctor nag: dom-webview ships `android/`, `ios/` and an
# expo-module.config.json, and autolinking scans node_modules — so an SDK-56 native
# module was being linked into an SDK-57 build.
#
# It exists solely to back Expo DOM components (`'use dom'`), require()d lazily by
# expo/src/dom/webview/ExpoDOMWebView.ts. This is a native-only app with no web target
# and no DOM components, so the peer is aligned with expo's own declaration and drops
# out of the tree entirely. `peerDependencyRules.ignoreMissing` does NOT work here —
# it silences the warning but pnpm 11 still auto-installs the package (verified).
# Delete this block and run `npx expo install @expo/dom-webview --pnpm` if a `'use dom'`
# component is ever added.
packageExtensions:
  '@expo/log-box':
    peerDependenciesMeta:
      '@expo/dom-webview':
        optional: true
