packages:
  - "packages/*"
  - "apps/*"
  # apps/mobile is a standalone Expo project with its own pnpm root + lockfile
  # (Metro needs nodeLinker: hoisted, which would clash with this repo's native
  # deps). Exclude it so root installs/`pnpm -r` never pull React Native in.
  - "!apps/mobile"
# pnpm 11 enforces a 24h minimumReleaseAge supply-chain delay by default.
# baseline-browser-mapping is a benign, fast-moving transitive browser-data
# package that frequently ships same-day patches; exempt it so installs aren't
# blocked while keeping the 24h delay active for every other dependency.
minimumReleaseAgeExclude:
  - baseline-browser-mapping
allowBuilds:
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  workerd: true
# agents' decorator plugin requires Babel 8, but its optional bundler plugin also
# accepts Babel 7 and pnpm otherwise resolves that older core for both. Supply the
# missing core dependency only for the affected release; review on agents upgrades.
packageExtensions:
  "agents@0.33.0":
    dependencies:
      "@babel/core": "^8.0.1"
# rolldown 1.3's wasm32 binding pins @emnapi/core and @emnapi/runtime to
# 2.0.0-beta.2. pnpm then resolves @astrojs/check's @emnapi/runtime peer to that
# beta while its @emnapi/core stays 1.x, and apps/web's `astro check` fails
# ("The @astrojs/check and typescript packages are required"). Keep the pair on
# one stable release; drop this once rolldown's binding ships against a stable
# emnapi 2.
overrides:
  "@emnapi/core": 1.11.3
  "@emnapi/runtime": 1.11.3
