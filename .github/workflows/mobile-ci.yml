# Runs the mobile app's existing quality gates on every PR / push that touches it.
# apps/mobile is a STANDALONE pnpm root (excluded from the monorepo workspace — see
# its pnpm-workspace.yaml), so every step runs inside apps/mobile with its own
# lockfile. It runs the app's own `pnpm verify`, the gate developers run locally.
# Mutation testing (pnpm mutation / Stryker) is intentionally left to
# a separate nightly — it's far heavier than a per-PR check.
name: Mobile CI

on:
  push:
    # The repository's default branch. `main` does not exist here, so a push never ran this.
    branches: [master]
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']

# A newer push to the same branch cancels an in-flight run for it.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  check:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The mobile app has its own lockfile and package-manager version. Use the
      # same pnpm as local installs and EAS so widget patch hashes stay compatible.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          package_json_file: apps/mobile/package.json

      # Expo SDK 58 needs Node 22.13+ / 24.3+, and so does RNTL 14 (engines ^22.13 || >=24).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      # Frozen install: CI must match the committed lockfile exactly (also sidesteps
      # pnpm's minimum-release-age delay, which only gates new resolutions).
      - run: pnpm install --frozen-lockfile

      # Typed routes live in .expo/types, which the dev server writes and git ignores.
      # Without them expo-router's Href falls back to a plain string, so a mistyped
      # route passes the typecheck.
      - name: Generate typed routes
        run: pnpm exec expo customize tsconfig.json

      # The same gate a developer runs (package.json `verify`): the recorded-runtime check
      # first, then typecheck, lint, deprecated APIs, React Compiler bailouts and the tests
      # with the coverage gate. One script, so CI cannot drift from it. The runtime check
      # needs only node_modules: it fingerprints the tree and compares native-runtimes.json.
      - name: Verify
        run: pnpm verify
