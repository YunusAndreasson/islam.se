name: Bug report
description: Something on islam.se or in the app doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        A wrong fact, quote or reference in a text goes through »Föreslå en
        rättelse« at the end of the page instead. Security holes go to
        SECURITY.md, never here.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The website
        - The app on iOS
        - The app on Android
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page
      description: The URL, for the website.
      placeholder: https://islam.se/bonetider/stockholm/
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: For the website.
      placeholder: Firefox 150 on Windows 11
  - type: input
    id: app
    attributes:
      label: App version, device and OS
      description: For the app. The version is at the end of »Om appen« in its settings.
      placeholder: 1.3.0 on an iPhone 16 with iOS 26.1
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open …
        2. Tap …
